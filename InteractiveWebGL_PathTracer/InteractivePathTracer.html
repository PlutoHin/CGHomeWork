<!-- Whitted_RayTracing.html 完整代码 -->
<!DOCTYPE html>
<html lang="en">

<head>
	<title>Real-time Path Tracer - Interactive Gallery</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">
	<link href="css/default.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500&display=swap" rel="stylesheet">

	<style>
		body {
			margin: 0;
			overflow: hidden;
			background-color: #000;
			font-family: 'Roboto', sans-serif;
		}

		#ui-container {
			position: absolute;
			top: 20px;
			left: 20px;
			background: rgba(255, 255, 255, 0.15);
			backdrop-filter: blur(10px);
			padding: 20px;
			border-radius: 12px;
			border: 1px solid rgba(255, 255, 255, 0.2);
			color: white;
			pointer-events: none;
			box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
			max-width: 300px;
		}

		h1 {
			font-size: 18px;
			margin: 0 0 10px 0;
			font-weight: 500;
			letter-spacing: 1px;
			color: #fff;
		}

		p {
			font-size: 13px;
			line-height: 1.6;
			color: #ddd;
			margin: 5px 0;
		}

		.key {
			display: inline-block;
			background: rgba(0, 0, 0, 0.3);
			padding: 2px 6px;
			border-radius: 4px;
			font-weight: bold;
			color: #4db8ff;
			font-family: monospace;
		}

		.status {
			margin-top: 15px;
			padding-top: 10px;
			border-top: 1px solid rgba(255, 255, 255, 0.2);
			font-size: 12px;
			font-weight: 500;
		}
	</style>

	<script type="importmap">
		{ "imports": { "three": "./js/three.module.min.js" } }
	</script>
	<script type="module">
		import * as THREE from 'three';
		window.THREE = THREE;
		import Stats from './js/stats.module.js';
		window.Stats = Stats;
		import GUI from './js/lil-gui.module.min.js';
		window.GUI = GUI;
	</script>
	<script src="js/BufferGeometryUtils.js"></script>
</head>

<body>
	<div id="container"></div>

	<div id="ui-container">
		<h1>RAY TRACER v3.0</h1>
		<p>渲染模式: <b>EMA Path Tracing</b></p>
		<p>按 <span class="key">C</span> 切换控制对象</p>
		<p>当前控制: <b id="control-mode-text" style="color:#00ff88">摄像机 (漫游)</b></p>
		<hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.2); margin: 10px 0;">
		<p><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
			前后左右移动</p>
		<p><span class="key">E</span> 上升 <span class="key">Q</span> 下降</p>
		<p><span class="key">鼠标左键拖拽</span> 旋转视角</p>
		<p style="font-size: 11px; color: #888; margin-top: 10px;">* 调节参数后点击屏幕可恢复键盘控制</p>
		<div class="status" id="render-status">状态: 初始化渲染引擎...</div>
	</div>

	<script defer src="js/MobileJoystickControls.js"></script>
	<script defer src="js/RayTracingCommon.js"></script>
	<script defer src="js/InitCommon.js"></script>
	<script defer src="js/InteractivePathTracer.js"></script>
</body>

</html>
